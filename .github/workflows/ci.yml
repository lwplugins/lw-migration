name: CI

on:
  # release.yml calls this workflow and releases only when every job passes.
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  admin-build:
    name: Admin build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build
        run: npm ci && npm run build

      # build/ is committed (the release ships it); a stale copy fails here.
      - name: Committed build is up to date
        run: git diff --exit-code -- build languages

      - name: Lint JS
        run: npm run lint:js

      - name: Unit tests (Vitest)
        run: npm test

  phpcs:
    name: PHP CodeSniffer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: composer, cs2pr

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPCS
        run: composer phpcs -- -q --report=checkstyle | cs2pr

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPStan
        run: composer analyse

  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # PHPUnit 10 needs PHP 8.1+; the plugin itself supports 8.0, which
        # PHPCompatibility (phpcs) and PHPStan (phpVersion min 8.0) check.
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: bz2, sodium, pcntl, posix
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run unit and WordPress tests
        run: composer test

  integration:
    name: Database tests (${{ matrix.db }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        db: ['mysql:8.0', 'mariadb:10.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: bz2, mysqli, sodium
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      # The same script as on a developer machine: it starts the database
      # container, waits for it and runs the integration suite.
      - name: Run integration tests
        env:
          LWM_DB_IMAGE: ${{ matrix.db }}
        run: bash bin/test-db.sh
